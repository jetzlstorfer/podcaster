version: 2
updates:
  # Python backend dependencies (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"

  # Hosted-agent service dependencies (src/*/requirements.txt)
  - package-ecosystem: "pip"
    directories:
      - "/src/researcher"
      - "/src/scriptwriter"
      - "/src/narrator"
    schedule:
      interval: "weekly"
    groups:
      hosted-agents:
        patterns:
          - "*"

  # Frontend dependencies (frontend/package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"

  # Dev container features
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      devcontainers:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
