name: Deploy to Azure

on:
  workflow_run:
    workflows: [Lint and Build]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC federated credential
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: azd deploy
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      AZURE_ENV_NAME:                    ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION:                    ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID:             ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP:              ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CLIENT_ID:                   ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID:                   ${{ vars.AZURE_TENANT_ID }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      AZURE_AI_PROJECT_ID:               ${{ vars.AZURE_AI_PROJECT_ID }}
      FOUNDRY_PROJECT_ENDPOINT:          ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL:                     ${{ vars.FOUNDRY_MODEL }}
      FOUNDRY_IMAGE_MODEL:               ${{ vars.FOUNDRY_IMAGE_MODEL }}
      RESEARCHER_AGENT_NAME:             ${{ vars.RESEARCHER_AGENT_NAME }}
      SCRIPTWRITER_AGENT_NAME:           ${{ vars.SCRIPTWRITER_AGENT_NAME }}
      NARRATOR_AGENT_NAME:               ${{ vars.NARRATOR_AGENT_NAME }}
      AUTH_CLIENT_ID:                    ${{ vars.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET:                ${{ secrets.AUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build vendored agent wheels
        run: make agent-wheels

      - name: Install azd
        uses: azure/setup-azd@v2

      - name: Log in to Azure (OIDC)
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}"

      - name: Install azd extensions
        run: azd extension install azure.ai.agents

      - name: Hydrate azd environment
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION                    "$AZURE_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID             "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_RESOURCE_GROUP              "$AZURE_RESOURCE_GROUP"
          azd env set AZURE_AI_PROJECT_ID              "$AZURE_AI_PROJECT_ID"
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$AZURE_CONTAINER_REGISTRY_ENDPOINT"
          azd env set FOUNDRY_PROJECT_ENDPOINT          "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set FOUNDRY_MODEL                     "$FOUNDRY_MODEL"
          azd env set FOUNDRY_IMAGE_MODEL               "$FOUNDRY_IMAGE_MODEL"
          azd env set RESEARCHER_AGENT_NAME             "$RESEARCHER_AGENT_NAME"
          azd env set SCRIPTWRITER_AGENT_NAME           "$SCRIPTWRITER_AGENT_NAME"
          azd env set NARRATOR_AGENT_NAME               "$NARRATOR_AGENT_NAME"

      - name: Deploy
        run: azd deploy --no-prompt
