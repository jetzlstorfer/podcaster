# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: podcaster
metadata:
    template: podcaster@0.1.0
services:
    narrator:
        project: ./src/narrator
        host: azure.ai.agent
        language: python
        kind: hosted
        name: narrator
        protocols:
            - protocol: responses
              version: "2.0.0"
        env:
            AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT}
            AZURE_SPEECH_RESOURCE_ID: ${AZURE_SPEECH_RESOURCE_ID}
            USE_SPEECH_ENTRA_AUTH: "true"
            AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL}
            AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER}
        codeConfiguration:
            runtime: python_3_13
            entryPoint: main.py
            dependencyResolution: remote_build
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        startupCommand: python main.py
    researcher:
        project: ./src/researcher
        host: azure.ai.agent
        language: python
        kind: hosted
        name: researcher
        protocols:
            - protocol: responses
              version: "2.0.0"
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            runtime: python_3_13
            entryPoint: main.py
            dependencyResolution: remote_build
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        startupCommand: python main.py
    scriptwriter:
        project: ./src/scriptwriter
        host: azure.ai.agent
        language: python
        kind: hosted
        name: scriptwriter
        protocols:
            - protocol: responses
              version: "2.0.0"
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            runtime: python_3_13
            entryPoint: main.py
            dependencyResolution: remote_build
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        startupCommand: python main.py
    web:
        project: .
        host: containerapp
        language: docker
        docker:
            path: ./Dockerfile
            context: .
            remoteBuild: true
hooks:
    postdeploy:
        shell: sh
        run: ./infra/hooks/postdeploy.sh
        continueOnError: true
        interactive: true
    postprovision:
        shell: sh
        run: ./infra/hooks/postprovision.sh
        continueOnError: true
        interactive: true
