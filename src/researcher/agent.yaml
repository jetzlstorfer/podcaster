# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: researcher
protocols:
  - protocol: responses
    version: "1.0.0"
resources:
  cpu: "0.5"
  memory: "1Gi"
environment_variables:
  # AZURE_AI_MODEL_DEPLOYMENT_NAME resolves from the active azd env.
  # FOUNDRY_* and APPLICATIONINSIGHTS_CONNECTION_STRING are injected at runtime —
  # never list them here.
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
code_configuration:
  runtime: python_3_13
  entry_point: main.py
  dependency_resolution: remote_build
